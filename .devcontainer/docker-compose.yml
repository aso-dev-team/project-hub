services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: linear_like
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d linear_like']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - appnet

  web:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: web
    ports:
      - 3000:3000
    volumes:
      - ..:/app
    depends_on:
      api:
        condition: service_started
    networks:
      - appnet

  api:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: api
    working_dir: /app
    environment:
      ConnectionStrings__AppDb: Host=postgres;Port=5432;Database=linear_like;Username=postgres;Password=postgres
      Web__Origins__0: http://localhost:3000
      Web__Origins__1: http://web:3000
    ports:
      - 5050:5050
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appnet

  ext-api:
    profiles:
      - ext-api
    image: golang:1
    working_dir: /app
    command: go run ./cmd/server
    environment:
      EXT_API_ADDR: :8081
      APP_API_BASE_URL: http://api:5050
      INTERNAL_SERVICE_API_KEY: dev-internal-service-key
    volumes:
      - ../ext-api:/app
    depends_on:
      api:
        condition: service_started
    networks:
      - appnet

volumes:
  pgdata:
  node_modules_root:
  node_modules_web:
  nuget_cache:
  pnpm_store:
  go_mod_cache:
  go_build_cache:

networks:
  appnet:
    driver: bridge
