# Manual/local compose kept as a non-canonical fallback for local DB boot.
# The authoritative full-stack development flow is .devcontainer/docker-compose.yml.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linear_like
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linear_like"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
